services:
  devcontainer:
    build:
      context: "${LOCAL_WORKSPACE_DIRECTORY}"
      dockerfile: ".devcontainer/docker/devcontainer.dockerfile"
      args:
        - PLATFORM=${PLATFORM}
        - ROS_DOMAIN_ID=${ROS_DOMAIN_ID}
        - CONTAINER_WORKSPACE_DIRECTORY=${CONTAINER_WORKSPACE_DIRECTORY}
        - CONTAINER_REPOSITORY_MOUNT_POINT=${CONTAINER_REPOSITORY_MOUNT_POINT}
        - USERNAME=${LOCAL_USERNAME}
        - USER_UID=${LOCAL_USER_UID}
        - USER_GID=${LOCAL_USER_GID}
    restart: unless-stopped
    volumes:
      - type: bind
        source: "${LOCAL_WORKSPACE_DIRECTORY}"
        target: "${CONTAINER_REPOSITORY_MOUNT_POINT}"
      - type: bind
        source: "${LOCAL_SELECTED_DIRECTORY}"
        target: "${CONTAINER_SELECTED_DIRECTORY_MOUNT_POINT}"
      - type: bind
        source: "/dev"
        target: "/dev"
      - type: bind
        source: "/etc/timezone"
        target: "/etc/timezone"
        read_only: true
      - type: bind
        source: "/etc/localtime"
        target: "/etc/localtime"
        read_only: true
    environment:
      - NVIDIA_DRIVER_CAPABILITIES=all
    network_mode: host
    privileged: true
    ipc: host
    runtime: nvidia
    depends_on:
      - fast_dds_router

  fast_dds_router:
    build:
      context: "${LOCAL_WORKSPACE_DIRECTORY}"
      dockerfile: ".devcontainer/docker/fast_dds_router.dockerfile"
      args:
        - ROS_DOMAIN_ID=${ROS_DOMAIN_ID}
    restart: unless-stopped
    volumes:
      - type: bind
        source: "/etc/timezone"
        target: "/etc/timezone"
        read_only: true
      - type: bind
        source: "/etc/localtime"
        target: "/etc/localtime"
        read_only: true
    network_mode: host
    privileged: true
