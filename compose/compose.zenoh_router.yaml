services:
  zenoh_router:
    build:
      context: ../..
      dockerfile: .devcontainer/docker/dockerfile.zenoh_router
      args:
        - TZ=${TZ}
    volumes:
      - type: bind
        source: /etc/localtime
        target: /etc/localtime
        read_only: true
    network_mode: host
    privileged: true
    ipc: host
