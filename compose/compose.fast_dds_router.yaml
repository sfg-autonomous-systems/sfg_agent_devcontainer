services:
  fast_dds_router:
    build:
      context: "../.."
      dockerfile: ".devcontainer/docker/fast_dds_router.dockerfile"
      args:
        - ROS_DOMAIN_ID=${ROS_DOMAIN_ID}
    restart: unless-stopped
    volumes:
      - type: bind
        source: "/etc/timezone"
        target: "/etc/timezone"
        read_only: true
      - type: bind
        source: "/etc/localtime"
        target: "/etc/localtime"
        read_only: true
    network_mode: host
    privileged: true
