services:
  fast_dds_router:
    build:
      context: ../..
      dockerfile: .devcontainer/docker/dockerfile.fast_dds_router
    volumes:
      - type: bind
        source: /etc/timezone
        target: /etc/timezone
        read_only: true
      - type: bind
        source: /etc/localtime
        target: /etc/localtime
        read_only: true
    network_mode: host
