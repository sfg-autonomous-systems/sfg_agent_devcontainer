version: v5.0

allowlist:
  - name: rt/tf
  - name: rt/tf_static
  - name: rt/global/*
  - name: rq/global/*
  - name: rr/global/*

participants:
  - name: local
    kind: simple
    domain: ${ROS_DOMAIN_ID}

  - name: global
    kind: simple
    domain: 0

specs:
  discovery-trigger: reader
  remove-unused-entities: true
